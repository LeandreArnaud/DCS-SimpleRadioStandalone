name: Client (Rust)

on:
  push:
    paths:
      - "client-rust/**"
      - ".github/workflows/client-rust.yml"
    tags:
      - "client-rust-v*"
  pull_request:
    paths:
      - "client-rust/**"
      - ".github/workflows/client-rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: client-rust

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-rust
      - run: cargo test --workspace

  build-windows:
    name: build + tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-rust
      - run: cargo test --workspace
      - run: cargo build --release -p srs-app
      - name: Check the exe has no non-system DLL dependencies
        shell: pwsh
        run: |
          $exe = "target\release\SR-ClientRadio.exe"
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe | Select-Object -First 1
          $deps = & $dumpbin.FullName /DEPENDENTS $exe
          Write-Host $deps
          $allowed = "kernel32|user32|gdi32|shell32|ole32|oleaut32|advapi32|ws2_32|bcrypt|ntdll|opengl32|dwmapi|imm32|uxtheme|winmm|setupapi|hid|dinput8|xinput|api-ms-win|msvcrt|secur32|crypt32|userenv|shlwapi|comctl32|comdlg32|version|avrt|mmdevapi|mfplat|mf\.dll|mfreadwrite|propsys|ksuser|dxgi|d3d11|dbghelp|psapi|iphlpapi|wintrust"
          $bad = ($deps | Select-String -Pattern "^\s+\S+\.dll" | ForEach-Object { $_.Line.Trim() } | Where-Object { $_ -notmatch $allowed })
          if ($bad) { Write-Error "Unexpected DLL dependencies: $bad"; exit 1 }
      - name: Assemble client folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Client | Out-Null
          Copy-Item target\release\SR-ClientRadio.exe dist\Client\
          Copy-Item -Recurse ..\DCS-SR-Client\AudioEffects dist\Client\AudioEffects
          New-Item -ItemType Directory -Force dist\Client\RadioModels | Out-Null
          Copy-Item ..\DCS-SR-Client\RadioModels\arc210.json dist\Client\RadioModels\
          Copy-Item ..\DCS-SR-Client\awacs-radios.json dist\Client\
      - uses: actions/upload-artifact@v4
        with:
          name: SRS-Client-Rust-${{ github.sha }}
          path: client-rust/dist

  release:
    name: pre-release
    if: startsWith(github.ref, 'refs/tags/client-rust-v')
    needs: [lint, test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SRS-Client-Rust-${{ github.sha }}
          path: dist
      - run: cd dist && zip -r ../SRS-Client-Rust-${GITHUB_REF_NAME#client-rust-v}.zip .
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: SRS-Client-Rust-*.zip
