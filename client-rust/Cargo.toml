[workspace]
resolver = "2"
members = [
    "crates/srs-protocol",
    "crates/srs-settings",
    "crates/srs-app",
    "crates/srs-audio",
    "crates/srs-net",
    "crates/srs-dcs",
    "crates/srs-client",
    "crates/srs-input",
    "crates/speexdsp-preprocess-sys",
    "crates/srs-opus-sys",
]

[workspace.package]
version = "2.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ciribob/DCS-SimpleRadioStandalone"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
log = "0.4"
proptest = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
debug = false

[profile.release-with-debug]
inherits = "release"
strip = false
debug = 1
